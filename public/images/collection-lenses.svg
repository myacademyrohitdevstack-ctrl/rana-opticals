<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F5F2"/>
      <stop offset="100%" stop-color="#E2EBE2"/>
    </radialGradient>
    <linearGradient id="lensBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F4F8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D9EBF0" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242722" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#242722" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#242722" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgLight)"/>
  <rect x="24" y="24" width="752" height="952" stroke="#687466" stroke-width="1.5" stroke-opacity="0.6"/>
  <ellipse cx="400" cy="580" rx="280" ry="40" fill="url(#dropShadow)"/>

  <!-- Optical Lens Geometry -->
  <g transform="translate(400, 440)">
    <!-- Main Precision Disc -->
    <circle cx="0" cy="0" r="140" fill="url(#lensBlue)" stroke="#687466" stroke-width="6"/>
    <ellipse cx="0" cy="0" rx="90" ry="140" stroke="#687466" stroke-width="2.5" stroke-dasharray="10 8" fill="none"/>

    <!-- Optical Center Target & Axis Grid -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#A77B50" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#A77B50" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
    <circle cx="0" cy="0" r="15" stroke="#A77B50" stroke-width="2.5" fill="none"/>

    <!-- Green AR Reflex Coating Wave -->
    <path d="M -80 -80 Q 20 -20 100 60" stroke="#687466" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <g transform="translate(400, 740)">
    <text text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="34" fill="#242722" letter-spacing="1">Prescription Lenses</text>
    <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#687466" letter-spacing="3" text-transform="uppercase">Single-Vision · Progressive · Anti-Glare</text>
    <text y="68" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#A77B50" letter-spacing="1.5">RANA OPTICAL DISPENSARY</text>
  </g>
</svg>
