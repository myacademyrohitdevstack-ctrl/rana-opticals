<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Charcoal Luxury Studio Background -->
    <radialGradient id="heroDark" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#363A33"/>
      <stop offset="60%" stop-color="#242722"/>
      <stop offset="100%" stop-color="#151714"/>
    </radialGradient>

    <!-- Warm Golden Light Glow -->
    <radialGradient id="glow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#A77B50" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#A77B50" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#242722" stop-opacity="0"/>
    </radialGradient>

    <!-- Pedestal Gradient -->
    <linearGradient id="pedestal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#474B43"/>
      <stop offset="50%" stop-color="#2E322B"/>
      <stop offset="100%" stop-color="#1E201C"/>
    </linearGradient>

    <!-- Metallic Gold Accent -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C59B63"/>
      <stop offset="50%" stop-color="#F2DDAD"/>
      <stop offset="100%" stop-color="#8E632D"/>
    </linearGradient>

    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#heroDark)"/>
  <circle cx="400" cy="400" r="320" fill="url(#glow)"/>
  <rect x="30" y="30" width="740" height="940" stroke="#A77B50" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Showcase Stone Pedestal -->
  <ellipse cx="400" cy="540" rx="320" ry="70" fill="url(#shadow)"/>
  <ellipse cx="400" cy="510" rx="280" ry="60" fill="url(#pedestal)" stroke="#A77B50" stroke-width="1" stroke-opacity="0.4"/>
  <ellipse cx="400" cy="500" rx="250" ry="50" fill="#3D4239"/>

  <!-- Featured Display Eyewear (Sculptural Angle) -->
  <g transform="translate(400, 390)">
    <!-- Temple back -->
    <path d="M -230 -10 Q -280 -40 -320 -80" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 230 -10 Q 280 -40 320 -80" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Left Rim -->
    <rect x="-240" y="-70" width="200" height="130" rx="22" stroke="url(#gold)" stroke-width="10" fill="#242722" fill-opacity="0.7"/>
    <path d="M -210 -40 L -70 30" stroke="#F5F1E9" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Rim -->
    <rect x="40" y="-70" width="200" height="130" rx="22" stroke="url(#gold)" stroke-width="10" fill="#242722" fill-opacity="0.7"/>
    <path d="M 70 -40 L 210 30" stroke="#F5F1E9" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Bridge -->
    <path d="M -40 -20 Q 0 -45 40 -20" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- Light Gleam on gold -->
    <circle cx="45" cy="-68" r="4" fill="#FFFFFF"/>
    <circle cx="-35" cy="-68" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Typography & Stamp -->
  <g transform="translate(400, 720)">
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#A77B50" stroke-width="1" opacity="0.5"/>
    <text y="50" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="38" fill="#F5F1E9" letter-spacing="4">RANA OPTICAL</text>
    <text y="88" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#A77B50" letter-spacing="4" text-transform="uppercase">Dispensary &amp; Fitting Suite</text>
    <text y="120" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#DCD5C9" letter-spacing="2">NAYAGAON · CHANDIGARH</text>
  </g>
</svg>
